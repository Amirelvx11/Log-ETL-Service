services:
  log_etl_service:
    container_name: log_etl
    image: log-etl-service
    build: .
    restart: always
    env_file:
      - .env
    networks:
      - logs_net
    volumes:
      - ./logs:/var/log
    command: ["python", "/app/run_scheduler.py"]

    healthcheck:
      test: ["CMD", "python", "-m", "healthcheck.healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

networks:
  logs_net:
    external: true
